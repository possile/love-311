<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💝 Will You Be My Valentine?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    color:white;
    text-align:center;
}

@keyframes gradientBG{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    position:relative;
    z-index:2;
}

h1{
    font-size:2.2rem;
    margin-bottom:40px;
    text-shadow:0 4px 20px rgba(0,0,0,0.3);
}

button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:40px;
    cursor:pointer;
    transition:all 0.3s ease;
    position:absolute;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
    left:50%;
    transform:translateX(-120%);
    box-shadow:0 0 20px rgba(255,77,109,0.7);
}

#yesBtn:hover{
    transform:translateX(-120%) scale(1.1);
}

#noBtn{
    background:white;
    color:#ff4d6d;
    left:50%;
    transform:translateX(20%);
    transition:all 0.15s ease;
}

.heart{
    position:absolute;
    color:white;
    animation:floatUp 6s linear infinite;
    opacity:0.6;
}

@keyframes floatUp{
    0%{transform:translateY(100vh) scale(0.5);opacity:0}
    50%{opacity:0.8}
    100%{transform:translateY(-10vh) scale(1.2);opacity:0}
}

.reveal{
    display:none;
    animation:fadeIn 1.5s ease forwards;
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(0.9)}
    to{opacity:1;transform:scale(1)}
}

.photo{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    margin:20px 0;
    border:5px solid white;
    box-shadow:0 0 40px rgba(255,255,255,0.8);
}

.message{
    max-width:400px;
    margin:auto;
    font-size:18px;
    line-height:1.6;
}

.footer{
    margin-top:20px;
    font-weight:600;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_115b9b0d59.mp3?filename=romantic-love-ambient-110973.mp3">
</audio>

<canvas id="confetti"></canvas>

<div class="container" id="questionBox">
    <h1>Will you be my Valentine?</h1>
    <button id="yesBtn">YES 💕</button>
    <button id="noBtn">No 😢</button>
</div>

<div class="container reveal" id="revealBox">
    <h1>She said YES! 💖</h1>
    <img src="your-photo.jpg" class="photo">
    <div class="message">
        From the moment I met you, everything changed.<br><br>
        You make my world brighter, softer, and more beautiful every day.<br><br>
        I’m the luckiest person to love you.
    </div>
    <div class="footer">
        Forever yours, Immanuel ❤️
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const revealBox = document.getElementById("revealBox");
const questionBox = document.getElementById("questionBox");
const music = document.getElementById("bgMusic");

let attempts = 0;
let yesScale = 1;

// start music on first interaction
document.body.addEventListener("mousemove",()=>{
    music.play();
},{once:true});

noBtn.addEventListener("mouseover",()=>{
    attempts++;
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.position = "absolute";

    yesScale += 0.15;
    yesBtn.style.transform = `translateX(-120%) scale(${yesScale})`;
});

yesBtn.addEventListener("click",()=>{
    questionBox.style.display="none";
    revealBox.style.display="block";
    launchConfetti();
});

// floating hearts
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    heart.style.animationDuration=(4+Math.random()*3)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,800);

// simple confetti
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function launchConfetti(){
    for(let i=0;i<150;i++){
        ctx.fillStyle=`hsl(${Math.random()*360},100%,70%)`;
        ctx.fillRect(Math.random()*canvas.width,
                     Math.random()*canvas.height,
                     6,6);
    }
}
</script>

</body>
</html>
