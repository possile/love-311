```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Good Morning ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow-x: hidden;
            color: white;

            background:
                radial-gradient(circle at top left, #ffb6c1, transparent 35%),
                radial-gradient(circle at bottom right, #ff69b4, transparent 40%),
                linear-gradient(135deg, #ff758c, #ff7eb3);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px 15px;
        }

        .card {
            width: 90%;
            max-width: 750px;

            padding: 40px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.3);

            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.2);

            animation: cardAppear 1.5s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* INTRO */

        .intro {
            min-height: 150px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .intro h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;

            text-shadow:
                0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .intro p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        /* CURSOR */

        .cursor {
            display: inline-block;

            width: 2px;
            height: 1.2em;

            background: white;

            margin-left: 3px;

            vertical-align: middle;

            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* REVEAL */

        .reveal {
            display: none;

            opacity: 0;
            transform: translateY(30px);

            margin-top: 25px;
        }

        .reveal.show {
            display: block;

            animation:
                revealAnimation 1.5s ease forwards;
        }

        @keyframes revealAnimation {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reveal h2 {
            font-size: 2.4rem;

            margin-bottom: 25px;

            text-shadow:
                0 3px 12px rgba(0, 0, 0, 0.25);
        }

        /* PHOTO */

        .photo-container {
            width: 220px;
            height: 220px;

            margin: 0 auto 25px;

            border-radius: 50%;

            overflow: hidden;

            border: 6px solid rgba(255, 255, 255, 0.85);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);

            animation:
                photoFloat 4s ease-in-out infinite;
        }

        .photo-container img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        @keyframes photoFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* MESSAGE */

        .message {
            max-width: 650px;

            margin: 0 auto;

            font-size: 1.08rem;

            line-height: 1.8;

            white-space: pre-line;

            min-height: 250px;
        }

        /* FOOTER */

        .footer {
            margin-top: 30px;

            font-size: 1rem;

            opacity: 0.9;
        }

        /* MUSIC BUTTON */

        .music-button {
            margin-top: 25px;

            padding: 12px 25px;

            border: none;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.25);

            color: white;

            font-size: 1rem;

            cursor: pointer;

            backdrop-filter: blur(10px);

            transition: 0.3s;
        }

        .music-button:hover {
            transform: scale(1.05);

            background: rgba(255, 255, 255, 0.4);
        }

        /* HEARTS */

        .heart {
            position: fixed;

            bottom: -50px;

            pointer-events: none;

            z-index: 10;

            animation: floatHeart linear forwards;
        }

        @keyframes floatHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.8);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg)
                    scale(1.3);

                opacity: 0;
            }
        }

        /* CONFETTI */

        .confetti {
            position: fixed;

            width: 8px;
            height: 14px;

            top: -20px;

            pointer-events: none;

            z-index: 20;

            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {

            from {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            to {
                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .card {
                width: 94%;

                padding: 30px 20px;

                border-radius: 25px;
            }

            .intro h1 {
                font-size: 2.1rem;
            }

            .intro p {
                font-size: 1rem;
            }

            .reveal h2 {
                font-size: 1.9rem;
            }

            .photo-container {
                width: 180px;
                height: 180px;
            }

            .message {
                font-size: 1rem;

                line-height: 1.7;
            }
        }
    </style>
</head>


<body>

    <div class="container">

        <div class="card">

            <!-- INTRO -->

            <div class="intro">

                <h1>
                    <span id="typingTitle"></span>
                    <span class="cursor"></span>
                </h1>

                <p id="introText"></p>

            </div>


            <!-- MAIN MESSAGE -->

            <div class="reveal" id="reveal">

                <h2>
                    Good Morning, Beautiful ❤️
                </h2>


                <!-- PHOTO -->

                <div class="photo-container">

                    <img
                        src="your-photo.jpg"
                        alt="Beautiful photo"
                    >

                </div>


                <!-- MESSAGE -->

                <div
                    class="message"
                    id="typedMessage">
                </div>


                <div class="footer">

                    Have a beautiful day, my love ❤️

                </div>


                <!-- MUSIC -->

                <button
                    class="music-button"
                    id="musicButton">

                    🎵 Start Music

                </button>

            </div>

        </div>

    </div>


    <!-- MUSIC FILE -->

    <audio
        id="music"
        src="music.mp3"
        preload="auto">
    </audio>


    <script>

        /* =========================
           ELEMENTS
        ========================= */

        const typingTitle =
            document.getElementById("typingTitle");

        const introText =
            document.getElementById("introText");

        const reveal =
            document.getElementById("reveal");

        const typedMessage =
            document.getElementById("typedMessage");

        const music =
            document.getElementById("music");

        const musicButton =
            document.getElementById("musicButton");


        /* =========================
           VARIABLES
        ========================= */

        let musicTimer = null;

        let musicStarted = false;


        /* =========================
           TYPING FUNCTION
        ========================= */

        function typeText(
            element,
            text,
            speed,
            callback
        ) {

            let index = 0;

            element.innerHTML = "";


            function type() {

                if (index < text.length) {

                    element.innerHTML +=
                        text.charAt(index);

                    index++;

                    setTimeout(
                        type,
                        speed
                    );

                } else {

                    if (callback) {
                        callback();
                    }

                }

            }

            type();
        }


        /* =========================
           MUSIC
        ========================= */

        function startMusic() {

            if (musicStarted) {
                return;
            }

            musicStarted = true;

            music.currentTime = 0;

            music.play()
                .then(function () {

                    musicButton.innerHTML =
                        "🔇 Pause Music";

                    startMusicTimer();

                })
                .catch(function () {

                    /*
                       Browser blocked autoplay.
                       User can press the button.
                    */

                    musicStarted = false;

                    musicButton.innerHTML =
                        "🎵 Start Music";

                });
        }


        /* =========================
           40 SECOND TIMER
        ========================= */

        function startMusicTimer() {

            clearTimeout(musicTimer);

            musicTimer =
                setTimeout(function () {

                    music.pause();

                    music.currentTime = 0;

                    musicStarted = false;

                    musicButton.innerHTML =
                        "🎵 Start Music";

                }, 40000);
        }


        /* =========================
           MUSIC BUTTON
        ========================= */

        musicButton.addEventListener(
            "click",
            function () {

                if (music.paused) {

                    musicStarted = true;

                    music.currentTime = 0;

                    music.play();

                    musicButton.innerHTML =
                        "🔇 Pause Music";

                    startMusicTimer();

                } else {

                    music.pause();

                    clearTimeout(musicTimer);

                    musicStarted = false;

                    musicButton.innerHTML =
                        "🎵 Start Music";

                }

            }
        );


        /* =========================
           START MUSIC ON PAGE LOAD
        ========================= */

        window.addEventListener(
            "load",
            function () {

                startMusic();

            }
        );


        /* =========================
           INTRO
        ========================= */

        typeText(

            typingTitle,

            "Good Morning ❤️",

            100,

            function () {

                setTimeout(function () {

                    typeText(

                        introText,

                        "I have a little message for you...",

                        60,

                        function () {

                            setTimeout(
                                showMessage,
                                1000
                            );

                        }

                    );

                }, 500);

            }

        );


        /* =========================
           SHOW MESSAGE
        ========================= */

        function showMessage() {

            reveal.classList.add("show");


            /* Main message */

            setTimeout(function () {

                typeText(

                    typedMessage,

`Good morning, my love ❤️

I hope you woke up feeling peaceful and happy today.

I just wanted you to know that you were one of the first thoughts on my mind this morning, and honestly, that already made my day a little brighter. 😊

May your day be filled with beautiful moments, good energy, and plenty of reasons to smile.

Take care of yourself for me, and remember that somewhere out here, someone is thinking about you and wishing you nothing but the best. ❤️🌹

Have a beautiful morning, sweetheart. ☀️💕`,

                    35

                );

            }, 700);


            /* Hearts */

            createHearts();


            /* Confetti */

            createConfetti();

        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        function createHearts() {

            setInterval(function () {

                const heart =
                    document.createElement("div");

                heart.classList.add("heart");


                const hearts = [
                    "❤️",
                    "💕",
                    "💗",
                    "💖",
                    "💓",
                    "💞"
                ];


                heart.innerHTML =
                    hearts[
                        Math.floor(
                            Math.random() *
                            hearts.length
                        )
                    ];


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.fontSize =
                    (15 +
                    Math.random() * 25)
                    + "px";


                heart.style.animationDuration =
                    (5 +
                    Math.random() * 5)
                    + "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(function () {

                    heart.remove();

                }, 10000);

            }, 700);

        }


        /* =========================
           CONFETTI
        ========================= */

        function createConfetti() {

            for (
                let i = 0;
                i < 80;
                i++
            ) {

                setTimeout(function () {

                    const piece =
                        document.createElement("div");


                    piece.classList.add(
                        "confetti"
                    );


                    piece.style.left =
                        Math.random() * 100
                        + "vw";


                    piece.style.animationDuration =
                        (3 +
                        Math.random() * 4)
                        + "s";


                    piece.style.transform =
                        `rotate(
                            ${Math.random() * 360}deg
                        )`;


                    document.body.appendChild(
                        piece
                    );


                    setTimeout(function () {

                        piece.remove();

                    }, 7000);

                }, i * 40);

            }

        }

    </script>

</body>
</html>
```
