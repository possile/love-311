<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Personalized Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 380px;
      text-align: center;
      animation: fadeIn 1.2s ease;
    }

    h1 {
      font-weight: 600;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #ff9800;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    button:hover {
      background: #ffa726;
      transform: scale(1.05);
    }

    .result {
      display: none;
      animation: slideUp 1s ease forwards;
    }

    .result img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      margin: 20px 0;
      border: 4px solid #fff;
    }

    .message {
      font-size: 18px;
      font-weight: 400;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="card" id="inputCard">
    <h1>What’s your name?</h1>
    <input type="text" id="nameInput" placeholder="Enter your name" />
    <button onclick="showResult()">Yes</button>
  </div>

  <div class="card result" id="resultCard">
    <h1 id="welcomeText"></h1>
    <img id="userImage" src="" alt="User Image">
    <p class="message" id="userMessage"></p>
  </div>

  <script>
    const users = {
      carol: {
        image: "images/carol.jpg",
        message: "Welcome Rose ❤️ This message was made just for you."
      },
      john: {
        image: "images/john.jpg",
        message: "Hey John 👋 Glad you’re here!"
      }
    };

    function showResult() {
      const name = document.getElementById("nameInput").value.trim().toLowerCase();

      if (!name) {
        alert("Please enter your name");
        return;
      }

      const inputCard = document.getElementById("inputCard");
      const resultCard = document.getElementById("resultCard");

      const user = users[name] || {
        image: "images/default.jpg",
        message: "Welcome! You’re special too ✨"
      };

      document.getElementById("welcomeText").innerText = `Hello, ${name.charAt(0).toUpperCase() + name.slice(1)}`;
      document.getElementById("userImage").src = user.image;
      document.getElementById("userMessage").innerText = user.message;

      inputCard.style.display = "none";
      resultCard.style.display = "block";
    }
  </script>

</body>
</html>
