<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💝 Will You Be My Valentine?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    background:black;
}

/* Romantic Disco Background */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    top:-50%;
    left:-50%;
    background:
        radial-gradient(circle at 20% 30%, #ff4d6d55 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, #ff9a9e55 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, #fbc2eb55 0%, transparent 40%);
    animation:disco 8s linear infinite;
    z-index:-1;
}

@keyframes disco{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

.container{
    position:relative;
    z-index:2;
}

h1{
    font-size:2.3rem;
    margin-bottom:50px;
    text-shadow:0 0 20px rgba(255,255,255,0.6);
}

button{
    padding:15px 40px;
    font-size:18px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    position:absolute;
    transition:0.3s ease;
}

#yesBtn{
    background:#ff4d6d;
    color:white;
    left:40%;
    box-shadow:0 0 25px #ff4d6d;
}

#yesBtn:hover{
    transform:scale(1.1);
    box-shadow:0 0 40px #ff4d6d;
}

#noBtn{
    background:white;
    color:#ff4d6d;
    left:55%;
}

.reveal{
    display:none;
    animation:fadeIn 1.5s ease forwards;
}

@keyframes fadeIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
}

.photo{
    width:180px;
    height:180px;
    border-radius:50%;
    object-fit:cover;
    margin:20px 0;
    border:5px solid white;
    box-shadow:0 0 40px rgba(255,255,255,0.8);
}

.footer{
    margin-top:20px;
    font-weight:600;
}

/* Floating Hearts */
.heart{
    position:absolute;
    color:white;
    animation:floatUp 6s linear infinite;
    opacity:0.7;
}

@keyframes floatUp{
    0%{transform:translateY(100vh) scale(0.5);opacity:0}
    50%{opacity:1}
    100%{transform:translateY(-10vh) scale(1.3);opacity:0}
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
}
</style>
</head>

<body>

<!-- USE YOUR OWN MUSIC FILE HERE -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<canvas id="confetti"></canvas>

<div class="container" id="questionBox">
    <h1>Will you be my Valentine?</h1>
    <button id="yesBtn">YES 💕</button>
    <button id="noBtn">No 😢</button>
</div>

<div class="container reveal" id="revealBox">
    <h1>She said YES! 💖</h1>
    <img src="your-photo.jpg" class="photo">
    <p>You make my world brighter every single day.</p>
    <div class="footer">Forever yours, Immanuel ❤️</div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const revealBox = document.getElementById("revealBox");
const questionBox = document.getElementById("questionBox");
const music = document.getElementById("bgMusic");

let yesSize = 1;

/* Music plays on first click (browser safe) */
document.addEventListener("click", function(){
    music.play().catch(()=>{});
}, { once: true });

/* NO button runs around smoothly */
noBtn.addEventListener("mouseover", ()=>{
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";

    yesSize += 0.15;
    yesBtn.style.transform = `scale(${yesSize})`;
});

/* YES click */
yesBtn.addEventListener("click", ()=>{
    questionBox.style.display="none";
    revealBox.style.display="block";
    launchConfetti();
});

/* Floating Hearts */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*30)+"px";
    heart.style.animationDuration=(4+Math.random()*3)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,700);

/* Confetti */
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

function launchConfetti(){
    for(let i=0;i<200;i++){
        ctx.fillStyle=`hsl(${Math.random()*360},100%,70%)`;
        ctx.fillRect(Math.random()*canvas.width,
                     Math.random()*canvas.height,
                     6,6);
    }
}
</script>

</body>
</html>
