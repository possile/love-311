
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Good Morning ❤️</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   BODY
========================= */

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(78, 65, 130, 0.55),
            transparent 35%
        ),

        radial-gradient(
            circle at 85% 85%,
            rgba(20, 75, 90, 0.5),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #050816,
            #11152b,
            #17112b,
            #071b24
        );

    background-size: 200% 200%;

    animation:
        backgroundMove 12s ease-in-out infinite alternate;
}


@keyframes backgroundMove {

    from {
        background-position: 0% 0%;
    }

    to {
        background-position: 100% 100%;
    }

}


/* =========================
   CONTAINER
========================= */

.container {
    width: 100%;

    padding: 20px;

    display: flex;

    justify-content: center;
}


/* =========================
   GLASS CARD
========================= */

.card {
    width: 100%;

    max-width: 650px;

    padding: 35px;

    border-radius: 30px;

    background:
        rgba(255, 255, 255, 0.08);

    border:
        1px solid rgba(255, 255, 255, 0.16);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.45);

    text-align: center;

    position: relative;

    z-index: 2;
}


/* =========================
   INTRO
========================= */

.intro {

    min-height: 150px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}


.intro h1 {

    font-size: 42px;

    color: #f5d98a;

    margin-bottom: 15px;

    text-shadow:
        0 0 20px
        rgba(245, 217, 138, 0.25);

}


.intro p {

    font-size: 19px;

    color: #d7d9e8;

}


/* =========================
   CURSOR
========================= */

.cursor {

    display: inline-block;

    width: 3px;

    height: 40px;

    background: #f5d98a;

    margin-left: 4px;

    animation:
        blink 0.8s infinite;

    vertical-align: middle;

}


@keyframes blink {

    50% {
        opacity: 0;
    }

}


/* =========================
   HEART START
========================= */

.heart-start {

    margin-top: 25px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    opacity: 0;

    transform: scale(0.7);

    pointer-events: none;

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;

}


.heart-start.show {

    opacity: 1;

    transform: scale(1);

    pointer-events: auto;

}


.tap-text {

    color: #d7d9e8;

    font-size: 17px;

    margin-bottom: 10px;

}


/* =========================
   HEART BUTTON
========================= */

.big-heart {

    border: none;

    background: transparent;

    font-size: 85px;

    cursor: pointer;

    animation:
        heartBeat 1.2s infinite;

    filter:
        drop-shadow(
            0 8px 20px
            rgba(255, 70, 90, 0.35)
        );

    transition:
        transform 0.3s ease;

}


.big-heart:hover {

    transform:
        scale(1.15);

}


@keyframes heartBeat {

    0%,
    100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }

}


/* =========================
   REVEAL
========================= */

.reveal {

    opacity: 0;

    transform:
        translateY(30px);

    pointer-events: none;

    display: none;

}


.reveal.show {

    display: block;

    animation:
        revealAnimation 1s ease forwards;

    pointer-events: auto;

}


@keyframes revealAnimation {

    from {

        opacity: 0;

        transform:
            translateY(30px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================
   MAIN TITLE
========================= */

.reveal h2 {

    color: #f5d98a;

    font-size: 30px;

    margin:
        15px 0 25px;

    text-shadow:
        0 0 18px
        rgba(245, 217, 138, 0.2);

}


/* =========================
   PHOTO
========================= */

.photo-container {

    width: 100%;

    max-width: 420px;

    height: 350px;

    margin:
        0 auto 25px;

    border-radius: 25px;

    overflow: hidden;

    border:
        5px solid
        rgba(255, 255, 255, 0.18);

    background:
        rgba(0, 0, 0, 0.25);

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.4);

    display: flex;

    justify-content: center;

    align-items: center;

}


.photo-container img {

    width: 100%;

    height: 100%;

    display: block;

    /*
       Shows the complete image
       without cropping it.
    */

    object-fit: contain;

}


/* =========================
   MESSAGE
========================= */

.message {

    min-height: 170px;

    white-space: pre-line;

    font-size: 18px;

    line-height: 1.7;

    color: #e5e6ef;

    text-align: left;

    background:
        rgba(255, 255, 255, 0.07);

    border:
        1px solid
        rgba(255, 255, 255, 0.1);

    padding: 20px;

    border-radius: 20px;

    margin-bottom: 20px;

}


/* =========================
   FOOTER
========================= */

.footer {

    font-size: 18px;

    color: #f5d98a;

    font-weight: bold;

    margin-top: 15px;

}


/* =========================
   FLOATING HEARTS
========================= */

.heart {

    position: fixed;

    bottom: -50px;

    font-size: 25px;

    animation:
        floatHeart linear forwards;

    pointer-events: none;

    z-index: 1;

}


@keyframes floatHeart {

    from {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: 1;

    }

    to {

        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity: 0;

    }

}


/* =========================
   CONFETTI
========================= */

.confetti {

    position: fixed;

    top: -20px;

    width: 8px;

    height: 14px;

    background: #f5d98a;

    animation:
        fall linear forwards;

    pointer-events: none;

    z-index: 3;

}


@keyframes fall {

    to {

        transform:
            translateY(110vh)
            rotate(720deg);

        opacity: 0;

    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .card {

        padding:
            25px 18px;

        border-radius: 25px;

    }


    .intro h1 {

        font-size: 32px;

    }


    .intro p {

        font-size: 16px;

    }


    .big-heart {

        font-size: 75px;

    }


    .reveal h2 {

        font-size: 25px;

    }


    .photo-container {

        height: 300px;

        max-width: 100%;

    }


    .message {

        font-size: 16px;

        line-height: 1.6;

        padding: 16px;

    }

}

</style>

</head>


<body>


<div class="container">

    <div class="card">


        <!-- =========================
             INTRO
        ========================== -->

        <div class="intro">

            <h1>

                <span id="typingTitle"></span>

                <span class="cursor"></span>

            </h1>


            <p id="introText"></p>


            <!-- HEART -->

            <div
                class="heart-start"
                id="heartStart"
            >

                <div class="tap-text">

                    Tap the heart for your surprise ❤️

                </div>


                <button
                    class="big-heart"
                    id="heartButton"
                    aria-label="Tap the heart"
                >

                    ❤️

                </button>

            </div>

        </div>


        <!-- =========================
             MAIN MESSAGE
        ========================== -->

        <div
            class="reveal"
            id="reveal"
        >


            <h2>

                Good Morning, Beautiful ❤️

            </h2>


            <!-- PHOTO -->

            <div class="photo-container">

                <img
                    id="photo"
                    src="./your-photo.jpg"
                    alt="Beautiful photo"
                >

            </div>


            <!-- MESSAGE -->

            <div
                class="message"
                id="typedMessage"
            ></div>


            <div class="footer">

                Have a beautiful day, Wifred ❤️

            </div>


        </div>

    </div>

</div>


<!-- =========================
     MUSIC
========================= -->

<audio
    id="music"
    src="./music.mp3"
    preload="auto"
></audio>


<script>


/* =========================
   ELEMENTS
========================= */

const typingTitle =
    document.getElementById(
        "typingTitle"
    );


const introText =
    document.getElementById(
        "introText"
    );


const heartStart =
    document.getElementById(
        "heartStart"
    );


const heartButton =
    document.getElementById(
        "heartButton"
    );


const reveal =
    document.getElementById(
        "reveal"
    );


const typedMessage =
    document.getElementById(
        "typedMessage"
    );


const music =
    document.getElementById(
        "music"
    );


const photo =
    document.getElementById(
        "photo"
    );


/* =========================
   PHOTO CHECK
========================= */

photo.onerror = function() {

    console.error(
        "Photo not found. Make sure the file is named exactly your-photo.jpg"
    );

    this.alt =
        "Photo not found. Rename your image to your-photo.jpg";

};


/* =========================
   MUSIC VARIABLES
========================= */

let musicTimer = null;

let musicStarted = false;


/* =========================
   TYPING FUNCTION
========================= */

function typeText(
    element,
    text,
    speed,
    callback
) {

    let index = 0;

    element.innerHTML = "";


    function type() {

        if (index < text.length) {

            element.innerHTML +=
                text.charAt(index);

            index++;

            setTimeout(
                type,
                speed
            );

        }

        else {

            if (callback) {

                callback();

            }

        }

    }


    type();

}


/* =========================
   START MUSIC
========================= */

function startMusic() {

    if (musicStarted) {

        return;

    }


    musicStarted = true;

    music.currentTime = 0;


    music.play()
        .then(function() {

            startMusicTimer();

        })
        .catch(function() {

            /*
             If the browser refuses
             playback, nothing breaks.
            */

            musicStarted = false;

        });

}


/* =========================
   40 SECOND MUSIC TIMER
========================= */

function startMusicTimer() {

    clearTimeout(
        musicTimer
    );


    musicTimer =
        setTimeout(
            function() {

                music.pause();

                music.currentTime = 0;

                musicStarted = false;

            },
            40000
        );

}


/* =========================
   HEART CLICK
========================= */

heartButton.addEventListener(
    "click",
    function() {


        /* =====================
           START MUSIC
        ====================== */

        startMusic();


        /* =====================
           HEART DISAPPEARS
        ====================== */

        heartStart.style.opacity =
            "0";

        heartStart.style.transform =
            "scale(1.5)";


        setTimeout(
            function() {

                heartStart.style.display =
                    "none";

            },
            500
        );


        /* =====================
           SHOW MESSAGE
        ====================== */

        setTimeout(
            function() {

                reveal.classList.add(
                    "show"
                );


                /* =================
                   TYPE MESSAGE
                ================== */

                setTimeout(
                    function() {

                        typeText(

                            typedMessage,

`Good morning, Winfred ❤️

I hope you woke up feeling peaceful and happy today.

I just wanted you to know that you were one of the first thoughts on my mind this morning, and honestly, that already made my day a little brighter. 😊

May your day be filled with beautiful moments, good energy, and plenty of reasons to smile.

Take care of yourself for me, and remember that somewhere out here, someone is thinking about you and wishing you nothing but the best. ❤️🌹

Have a beautiful morning, sweetheart. ☀️💕`,

                            35

                        );

                    },
                    700
                );


                /* =================
                   EFFECTS
                ================== */

                createHearts();

                createConfetti();


            },
            500
        );

    }
);


/* =========================
   INITIAL TYPING
========================= */

typeText(

    typingTitle,

    "Good Morning ❤️",

    100,

    function() {


        setTimeout(
            function() {

                typeText(

                    introText,

                    "I have a little surprise for you...",

                    60,

                    function() {


                        setTimeout(
                            function() {

                                heartStart.classList.add(
                                    "show"
                                );

                            },
                            700
                        );

                    }

                );

            },
            500
        );

    }

);


/* =========================
   FLOATING HEARTS
========================= */

function createHearts() {

    setInterval(
        function() {


            const heart =
                document.createElement(
                    "div"
                );


            heart.classList.add(
                "heart"
            );


            const hearts = [

                "❤️",
                "💕",
                "💗",
                "💖",
                "💓",
                "💞"

            ];


            heart.innerHTML =
                hearts[
                    Math.floor(
                        Math.random()
                        * hearts.length
                    )
                ];


            heart.style.left =
                Math.random() * 100
                + "vw";


            heart.style.fontSize =
                (
                    15 +
                    Math.random() * 25
                ) + "px";


            heart.style.animationDuration =
                (
                    5 +
                    Math.random() * 5
                ) + "s";


            document.body.appendChild(
                heart
            );


            setTimeout(
                function() {

                    heart.remove();

                },
                10000
            );


        },
        700
    );

}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

    for (
        let i = 0;
        i < 80;
        i++
    ) {


        setTimeout(
            function() {


                const piece =
                    document.createElement(
                        "div"
                    );


                piece.classList.add(
                    "confetti"
                );


                piece.style.left =
                    Math.random() * 100
                    + "vw";


                piece.style.animationDuration =
                    (
                        3 +
                        Math.random() * 4
                    ) + "s";


                piece.style.transform =
                    `rotate(
                        ${Math.random() * 360}deg
                    )`;


                document.body.appendChild(
                    piece
                );


                setTimeout(
                    function() {

                        piece.remove();

                    },
                    7000
                );


            },
            i * 40
        );

    }

}

</script>

</body>
</html>
